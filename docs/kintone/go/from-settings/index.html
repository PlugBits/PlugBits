<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlugBits for kintone|プラグインのページへ移動します</title>
<link rel="canonical" href="https://plugbits.app/kintone/">
<meta name="robots" content="noindex, follow">
<!-- Cloudflare Web Analytics --><script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "86511d1154774394986239de33d21882"}'></script><!-- End Cloudflare Web Analytics -->
<noscript><meta http-equiv="refresh" content="0; url=https://plugbits.app/kintone/"></noscript>
<script>
// 有料プラグインの設定画面の「PlugBits の他のプラグイン」枠から来た人を数えるページ(/kintone/go/from-settings/)。
// ?p=<どの製品の設定画面から> &to=<見せた製品>。数えるのは Cloudflare の beacon(上の defer の script)。
// to が 5 本のどれかならその商品ページへ、それ以外は一覧へ。読み込み(load)を待ってから移る。load が来なくても 1.5 秒で必ず移る
(function () {
  var PRODUCTS = ['kintone-gallery', 'kintone-listkit', 'kintone-rule-builder', 'kintone-excel-report', 'kintone-signage'];
  var to = '', from = '';
  try {
    var q = new URLSearchParams(location.search);
    to = q.get('to') || '';
    from = q.get('p') || '';
  } catch (_e) { to = ''; from = ''; }
  // 行き先にも ?from=<設定画面の製品> を残して、商品ページ側の page view でも内訳を数えられるようにする
  var suffix = PRODUCTS.indexOf(from) >= 0 ? '?from=' + from : '';
  var dest = (PRODUCTS.indexOf(to) >= 0 ? 'https://plugbits.app/kintone/' + to + '/' : 'https://plugbits.app/kintone/') + suffix;
  var done = false;
  function go() { if (done) return; done = true; location.replace(dest); }
  window.addEventListener('load', function () { setTimeout(go, 0); });
  setTimeout(go, 1500);
})();
</script>
</head>
<body>
<p><a href="https://plugbits.app/kintone/">PlugBits の kintone プラグイン一覧へ</a></p>
</body>
</html>
